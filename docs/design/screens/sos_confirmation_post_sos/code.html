<!-- Script to hide bottom nav and handle local UI logic -->
<script>
        (function() {
            // Hide the global bottom navigation for this "locked" state
            const bottomNav = document.querySelector('nav.fixed.bottom-0');
            if (bottomNav) {
                bottomNav.style.display = 'none';
            }

            // Cleanup on navigation or "Cancel" (Mock implementation)
            const cancelButton = document.getElementById('cancel-sos');
            cancelButton.addEventListener('click', () => {
                if(confirm("Confirm you are safe? This will stop the emergency broadcast.")) {
                    if (bottomNav) bottomNav.style.display = 'flex';
                    // In a real app, this would route back
                    window.location.reload(); 
                }
            });
            
            // Add a subtle "throb" to the background to maintain urgency
            let intensity = 0;
            let growing = true;
            const bgOverlay = document.querySelector('.bg-\\[\\#C8102E\\]');
            
            function animateUrgency() {
                if (growing) {
                    intensity += 0.05;
                    if (intensity >= 0.2) growing = false;
                } else {
                    intensity -= 0.05;
                    if (intensity <= 0) growing = true;
                }
                bgOverlay.style.boxShadow = `inset 0 0 ${20 + intensity * 100}px rgba(0,0,0,${0.2 + intensity})`;
                requestAnimationFrame(animateUrgency);
            }
            animateUrgency();
        })();
    </script>
