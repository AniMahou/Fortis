</div>
<span class="font-label-caps text-label-caps text-on-secondary-container mt-stack-sm tracking-widest opacity-50 uppercase">

        </span>
</div>
<script>
        // Subtle micro-interaction: The logo slightly scales on mouse move or device tilt
        document.addEventListener('mousemove', (e) => {
            const logo = document.querySelector('img');
            if (!logo) return;
            const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
            logo.style.transform = `translate(${xAxis}px, ${yAxis}px)`;
        });

        // Simulating the "splash" transition for the demo
        setTimeout(() => {
            const statusText = document.querySelector('.font-label-caps');
            if (statusText) {
                statusText.innerText = "Securing Channel";
                statusText.classList.add('transition-all', 'duration-500');
            }
        }, 2000);
    </script>
