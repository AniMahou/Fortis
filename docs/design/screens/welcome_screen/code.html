<!-- Hero Illustration Section -->
<div class="relative flex items-center justify-center w-full py-stack-lg overflow-hidden">
<!-- Ambient Animated Glow -->
<div class="absolute inset-0 flex items-center justify-center opacity-30">
<svg fill="none" height="300" viewbox="0 0 200 200" width="300" xmlns="http://www.w3.org/2000/svg">
<circle cx="100" cy="100" fill="url(#glowGradient)" r="80">
<animate attributename="r" dur="4s" repeatcount="indefinite" values="70;90;70"></animate>
<animate attributename="opacity" dur="4s" repeatcount="indefinite" values="0.2;0.5;0.2"></animate>
</circle>
<defs>
<radialgradient cx="0" cy="0" gradienttransform="translate(100 100) rotate(90) scale(100)" gradientunits="userSpaceOnUse" id="glowGradient" r="1">
<stop stop-color="#B0B0B0"></stop>
<stop offset="1" stop-color="#B0B0B0" stop-opacity="0"></stop>
</radialgradient>
</defs>
</svg>
</div>
<!-- Mesh Network Illustration -->
<div class="relative z-10 w-64 h-64 flex items-center justify-center">
<svg class="w-full h-full drop-shadow-[0_0_8px_rgba(176,176,176,0.4)]" viewbox="0 0 200 200">
<!-- Connecting Lines -->
<line stroke="black" stroke-linecap="round" stroke-width="2" x1="100" x2="160" y1="40" y2="140">
<animate attributename="stroke-dasharray" dur="2s" fill="freeze" from="0,200" to="200,0"></animate>
</line>
<line stroke="black" stroke-linecap="round" stroke-width="2" x1="160" x2="40" y1="140" y2="140">
<animate attributename="stroke-dasharray" begin="0.5s" dur="2s" fill="freeze" from="0,200" to="200,0"></animate>
</line>
<line stroke="black" stroke-linecap="round" stroke-width="2" x1="40" x2="100" y1="140" y2="40">
<animate attributename="stroke-dasharray" begin="1s" dur="2s" fill="freeze" from="0,200" to="200,0"></animate>
</line>
<!-- Nodes -->
<circle cx="100" cy="40" fill="black" r="8">
<animate attributename="r" dur="3s" repeatcount="indefinite" values="8;10;8"></animate>
</circle>
<circle cx="160" cy="140" fill="black" r="8">
<animate attributename="r" begin="1s" dur="3s" repeatcount="indefinite" values="8;10;8"></animate>
</circle>
<circle cx="40" cy="140" fill="black" r="8">
<animate attributename="r" begin="2s" dur="3s" repeatcount="indefinite" values="8;10;8"></animate>
</circle>

<circle cx="100" cy="40" r="8" stroke="black" stroke-opacity="0.3">
<animate attributename="r" dur="2s" repeatcount="indefinite" values="8;20"></animate>
<animate attributename="opacity" dur="2s" repeatcount="indefinite" values="1;0"></animate>

<div class="flex flex-col items-center text-center space-y-stack-md mt-stack-sm">

    </h1>
<p class="font-body-lg text-body-lg text-secondary max-w-[280px] leading-relaxed">
