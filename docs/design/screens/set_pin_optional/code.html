<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-container-highest": "#e2e2e2", "error": "#ba1a1a", "error-container": "#ffdad6", "secondary-fixed": "#e3e2e2", "on-error": "#ffffff", "surface-tint": "#5f5e5e", "on-primary-container": "#858383", "surface-container-lowest": "#ffffff", "surface-container-low": "#f3f3f4", "on-tertiary-container": "#f63949", "outline": "#747878", "on-background": "#1a1c1c", "background": "#f9f9f9", "outline-variant": "#c4c7c7", "on-secondary-fixed": "#1a1c1c", "surface-container": "#eeeeee", "secondary": "#5e5e5f", "primary-fixed-dim": "#c8c6c5", "on-secondary-container": "#626363", "on-tertiary-fixed": "#410007", "primary-fixed": "#e5e2e1", "surface": "#f9f9f9", "tertiary-fixed": "#ffdad8", "on-error-container": "#93000a", "tertiary-container": "#410007", "on-primary": "#ffffff", "on-secondary-fixed-variant": "#464747", "primary": "#000000", "tertiary": "#000000", "surface-bright": "#f9f9f9", "tertiary-fixed-dim": "#ffb3b1", "surface-container-high": "#e8e8e8", "on-tertiary-fixed-variant": "#92001c", "on-tertiary": "#ffffff", "surface-variant": "#e2e2e2", "primary-container": "#1c1b1b", "inverse-on-surface": "#f0f1f1", "secondary-fixed-dim": "#c7c6c6", "secondary-container": "#e0dfdf", "on-primary-fixed": "#1c1b1b", "on-primary-fixed-variant": "#474746", "inverse-primary": "#c8c6c5", "on-secondary": "#ffffff", "surface-dim": "#dadada", "on-surface-variant": "#444748", "inverse-surface": "#2f3131", "on-surface": "#1a1c1c" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "stack-sm": "8px", "gutter": "16px", "stack-lg": "32px", "margin-mobile": "16px", "margin-desktop": "24px", "stack-md": "16px", "base-unit": "4px" }, "fontFamily": { "button": ["Inter"], "headline-lg": ["Inter"], "body-sm": ["Inter"], "headline-lg-mobile": ["Inter"], "label-caps": ["Inter"], "body-lg": ["Inter"], "headline-md": ["Inter"] }, "fontSize": { "button": ["14px", {"lineHeight": "20px", "fontWeight": "600"}], "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}], "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}], "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}], "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}], "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}], "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}] } } } };</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-lg text-on-surface flex items-center justify-center min-h-screen"><main class="w-full flex flex-col items-center justify-center"><div class="flex flex-col w-full max-w-md mx-auto px-margin-mobile">
<!-- Top Navigation & Progress -->
<div class="flex items-center justify-between py-stack-md">
<button class="flex items-center justify-center w-10 h-10 -ml-2 active:opacity-60 transition-opacity">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="flex gap-2">
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
<div class="w-2 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
<!-- Hero Icon Section -->
<div class="flex flex-col items-center justify-center mt-stack-md mb-stack-lg">
<div class="relative">
<div class="w-20 h-20 rounded-full bg-secondary-container flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-primary text-[40px]" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<!-- Subtle pulse animation for delight -->
<div class="absolute inset-0 rounded-full bg-primary/5 animate-ping" style="animation-duration: 3s;"></div>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface text-center mt-stack-md px-4">
      Set a PIN for Extra Security
    </h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-2">Optional but recommended for VOX users.</p>
</div>
<!-- PIN Input Fields -->
<div class="flex justify-center gap-4 mb-stack-lg" id="pin-display">
<div class="w-4 h-4 rounded-full bg-transparent border-2 border-outline-variant transition-all duration-200" data-index="0"></div>
<div class="w-4 h-4 rounded-full bg-transparent border-2 border-outline-variant transition-all duration-200" data-index="1"></div>
<div class="w-4 h-4 rounded-full bg-transparent border-2 border-outline-variant transition-all duration-200" data-index="2"></div>
<div class="w-4 h-4 rounded-full bg-transparent border-2 border-outline-variant transition-all duration-200" data-index="3"></div>
</div>
<!-- Keypad Grid -->
<div class="grid grid-cols-3 gap-y-4 gap-x-8 mx-auto mb-stack-lg">
<button class="keypad-btn w-[64px] h-[64px] rounded-full bg-surface flex items-center justify-center font-headline-md text-headline-md text-on-surface border border-outline-variant active:bg-surface-container-high transition-colors" data-value="1">1</button>
<button class="keypad-btn w-[64px] h-[64px] rounded-full bg-surface flex items-center justify-center font-headline-md text-headline-md text-on-surface border border-outline-variant active:bg-surface-container-high transition-colors" data-value="2">2</button>
<button class="keypad-btn w-[64px] h-[64px] rounded-full bg-surface flex items-center justify-center font-headline-md text-headline-md text-on-surface border border-outline-variant active:bg-surface-container-high transition-colors" data-value="3">3</button>
<button class="keypad-btn w-[64px] h-[64px] rounded-full bg-surface flex items-center justify-center font-headline-md text-headline-md text-on-surface border border-outline-variant active:bg-surface-container-high transition-colors" data-value="4">4</button>
<button class="keypad-btn w-[64px] h-[64px] rounded-full bg-surface flex items-center justify-center font-headline-md text-headline-md text-on-surface border border-outline-variant active:bg-surface-container-high transition-colors" data-value="5">5</button>
<button class="keypad-btn w-[64px] h-[64px] rounded-full bg-surface flex items-center justify-center font-headline-md text-headline-md text-on-surface border border-outline-variant active:bg-surface-container-high transition-colors" data-value="6">6</button>
<button class="keypad-btn w-[64px] h-[64px] rounded-full bg-surface flex items-center justify-center font-headline-md text-headline-md text-on-surface border border-outline-variant active:bg-surface-container-high transition-colors" data-value="7">7</button>
<button class="keypad-btn w-[64px] h-[64px] rounded-full bg-surface flex items-center justify-center font-headline-md text-headline-md text-on-surface border border-outline-variant active:bg-surface-container-high transition-colors" data-value="8">8</button>
<button class="keypad-btn w-[64px] h-[64px] rounded-full bg-surface flex items-center justify-center font-headline-md text-headline-md text-on-surface border border-outline-variant active:bg-surface-container-high transition-colors" data-value="9">9</button>
<div class="w-[64px]"></div>
<button class="keypad-btn w-[64px] h-[64px] rounded-full bg-surface flex items-center justify-center font-headline-md text-headline-md text-on-surface border border-outline-variant active:bg-surface-container-high transition-colors" data-value="0">0</button>
<button class="keypad-btn w-[64px] h-[64px] rounded-full bg-surface flex items-center justify-center font-headline-md text-headline-md text-on-surface active:opacity-50 transition-opacity" data-value="backspace">
<span class="material-symbols-outlined">backspace</span>
</button>
</div>
<!-- Action Bar -->
<div class="flex gap-4 w-full mt-auto mb-stack-lg">
<button class="flex-1 py-4 font-button text-button text-secondary text-center active:opacity-60 transition-opacity">
      Skip
    </button>
<button class="flex-1 py-4 bg-primary rounded-xl font-button text-button text-on-primary shadow-md active:scale-[0.98] transition-all disabled:opacity-30" disabled="" id="confirm-btn">
      Confirm
    </button>
</div>
<script>
    (function() {
      let pin = "";
      const dots = document.querySelectorAll('#pin-display div');
      const confirmBtn = document.getElementById('confirm-btn');

      function updateDisplay() {
        dots.forEach((dot, index) => {
          if (index < pin.length) {
            dot.classList.add('bg-primary', 'border-primary', 'scale-125');
            dot.classList.remove('border-outline-variant');
          } else {
            dot.classList.remove('bg-primary', 'border-primary', 'scale-125');
            dot.classList.add('border-outline-variant');
          }
        });
        
        confirmBtn.disabled = pin.length < 4;
      }

      document.querySelectorAll('.keypad-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = btn.getAttribute('data-value');
          
          if (val === 'backspace') {
            pin = pin.slice(0, -1);
          } else if (pin.length < 4) {
            pin += val;
            
            // Tactile feedback feel
            btn.classList.add('scale-95');
            setTimeout(() => btn.classList.remove('scale-95'), 100);
          }
          
          updateDisplay();
          
          // Little shake on completion for attention
          if (pin.length === 4) {
            const container = document.getElementById('pin-display');
            container.classList.add('animate-bounce');
            setTimeout(() => container.classList.remove('animate-bounce'), 500);
          }
        });
      });
    })();
  </script>
<style>
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .animate-bounce {
      animation: bounce 0.4s ease-in-out;
    }
  </style>
</div></main></body></html>
